# Checks that need no model, no secret and no Anthropic credential (ADR-0005, ADR-0007).
# Model evals run on the owner's machine; the eval-record job only checks their records.
# Event data reaches scripts through env and GITHUB_EVENT_PATH, never pasted into `run:`.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - id: base
        name: Find the commit the range checks start from
        run: echo "base=$(python3 -I tools/ci.py base)" >> "$GITHUB_OUTPUT"

  hygiene:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ needs.changes.outputs.base }}
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Identities, tokens, email addresses and denied paths in every commit
        run: python3 -I tools/git_hooks.py check-range "$BASE"
      - name: Install gitleaks from its release, checksum first
        run: |
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks over every commit in the range
        run: '"$RUNNER_TEMP/gitleaks" git --log-opts="$BASE..HEAD" --config .gitleaks.toml --redact --no-banner --exit-code 1 .'

  commits:
    if: github.event_name == 'pull_request'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ needs.changes.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Commit messages, and prose findings to the job summary
        run: python3 -I tools/ci.py commits --base "$BASE"
      - name: Requirement IDs in added code
        run: python3 -I config/skills/github-issue-lifecycle/scripts/issue_lifecycle.py diff-check --base "$BASE"

  lint:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Held at 100% branch coverage: every measured file that was at 100% when CI began.
      HELD_AT_100: "config/hooks/*,tools/git_hooks.py,tools/ci.py,tools/cfg/*,eval/*,config/skills/plain-prose/scripts/*,config/skills/writing-docs/scripts/*"
      NOT_YET_100: "tools/cfg/lock.py"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      # Separate runs, because tests/ and plain-prose's tests both have a test_vendored.py.
      - run: python -I -m pytest tests --cov --cov-append --cov-report=
      - run: python -I -m pytest config/skills/plain-prose/tests --cov --cov-append --cov-report=
      - run: python -I -m pytest config/skills/writing-docs/tests --cov --cov-append --cov-report=
      - run: python -I -m coverage report --skip-covered
      - name: Hold 100% branch coverage
        run: python -I -m coverage report --include="$HELD_AT_100" --omit="$NOT_YET_100" --fail-under=100
      - run: python -I -m pytest config/skills/github-issue-lifecycle/tests

  config:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Config checker, offline, for every host profile
        run: |
          shopt -s nullglob
          profiles=(hosts/*.json)
          if [ "${#profiles[@]}" -eq 0 ]; then echo "no host profiles" >&2; exit 1; fi
          for profile in "${profiles[@]}"; do
            python3 -I tools/check_config.py --host "$profile" --plugin-index plugins.lock.json --path-rule fail
          done
      - name: Every SPEC.md passes the spec validator
        run: python3 -I tools/ci.py specs

  eval-record:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: ${{ needs.changes.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Eval records match the files being merged
        run: python3 -I tools/cfg/eval_records.py verify --base "$BASE"
