# Tool settings only. Nothing here is built or installed as a package.

[project]
name = "claude-config"
version = "0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = [
    "tools",
    "eval",
    "config/hooks",
    "config/skills/plain-prose/scripts",
    "config/skills/writing-docs/scripts",
]
# Vendored upstream files are never edited, so their coverage isn't ours to raise.
omit = ["tools/vendor/*", "config/skills/*/scripts/vendored/*"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
target-version = "py313"
line-length = 100
# Everything the repo writes is linted, the hooks included since #20. What stays
# excluded below is never edited here: the upstream files skills vendor, and
# the frozen and vendored copies.
# "./" anchors the pattern to the repo root; a bare "config" would also skip any
# nested directory of that name, such as a future tools/config/.
# docs/history/ holds frozen copies that are never edited (ADR-0002), so lint
# findings there could never be fixed. tools/vendor/ holds upstream files
# kept byte for byte, with their hashes in VENDORED.json, for the same reason.
# The skills copied whole from claude-code-skills (#62) are kept as upstream
# wrote them too, so each one is listed; tests/test_vendored_skills.py checks
# that every skill whose VENDORED.json lists its SKILL.md is here.
extend-exclude = [
    "./config/skills/*/scripts/vendored",
    "./config/skills/adversarial-reviewer",
    "./config/skills/agent-workflow-designer",
    "./config/skills/api-design-reviewer",
    "./config/skills/api-test-suite-builder",
    "./config/skills/ci-cd-pipeline-builder",
    "./config/skills/database-schema-designer",
    "./config/skills/dependency-auditor",
    "./config/skills/migration-architect",
    "./config/skills/runbook-generator",
    "./config/skills/senior-architect",
    "./config/skills/senior-prompt-engineer",
    "./config/skills/senior-qa",
    "./config/skills/ship-gate",
    "./config/skills/skill-security-auditor",
    "./config/skills/skill-tester",
    "./config/skills/spec-driven-workflow",
    "./config/skills/tdd-guide",
    "./docs/history",
    "./tools/vendor",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"config/skills/*/tests/**" = ["S"]
# The hooks run git and gitleaks from PATH with argument lists and no shell, by design,
# as diff-check runs git and the lifecycle evals run git and claude; cfg's release
# module runs git the same way.
"tools/git_hooks.py" = ["S603", "S607"]
"tools/cfg/release.py" = ["S603", "S607"]
# deploy runs the release's checker and the hook commands, and cli runs a backup's
# restore.py, each with python3 and an argument list, never a shell.
"tools/cfg/deploy.py" = ["S603", "S607"]
"tools/cfg/cli.py" = ["S603", "S607"]
# The CI helper runs git and the repo's own checkers with argument lists and no shell.
"tools/ci.py" = ["S603", "S607"]
"config/skills/github-issue-lifecycle/scripts/issue_lifecycle.py" = ["S603", "S607"]
"config/skills/github-issue-lifecycle/evals/*.py" = ["S603", "S607"]
# The Jira lifecycle runs jira, gh and git with argument lists and no shell. Its urllib calls go
# only to the configured https:// site, or to a 127.0.0.1 test server, checked before any request.
"config/skills/jira-ticket-lifecycle/scripts/ticket_lifecycle.py" = ["S603", "S607", "S310"]
"config/skills/jira-ticket-lifecycle/evals/*.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "tools",
    "eval",
    "config/hooks",
    "config/skills/plain-prose/scripts/prose_check.py",
    "config/skills/writing-docs/scripts/doc_lint.py",
]
exclude = ["^tools/vendor/", "/scripts/vendored/"]
# tools/ has no __init__.py; name its modules from the repo root (tools.check_config).
explicit_package_bases = true
