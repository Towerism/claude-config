# Tool settings only. Nothing here is built or installed as a package.

[project]
name = "claude-config"
version = "0"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["tools"]

[tool.coverage.report]
show_missing = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
# The hooks run git and gitleaks from PATH with argument lists and no shell, by design.
"tools/git_hooks.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["tools"]
